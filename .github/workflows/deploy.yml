name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at workflow level. Jobs widen only what they need.
permissions: {}

# One deploy at a time. Do not cancel an in-flight deploy: a half-published
# Pages site is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only, the build never writes to the repo
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install Hugo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          gh release download "v${HUGO_VERSION}" \
            --repo gohugoio/hugo --pattern "$deb" --output "$deb"
          sudo dpkg -i "$deb"
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          hugo --gc --minify --panicOnWarning --baseURL "$BASE_URL/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the built artifact to Pages
      id-token: write  # OIDC, so deploy-pages uses a short-lived token not a secret
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
